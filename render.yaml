# Render Blueprint: NestJS + Prisma backend and its PostgreSQL database.
# The frontend stays on Vercel (see DEPLOY_RENDER.md). No secret values live in this file:
# GEMINI_API_KEY is entered in the Render dashboard (sync: false), JWT_SECRET is generated by Render.
#
# COST (verify current prices in the Render dashboard before applying):
#  - web service "starter" is a PAID plan, required because a persistent disk is only available on paid services.
#  - the 1 GB disk is billed separately (small, per GB per month).
#  - the database below uses the free plan: free databases expire after a limited period and have no
#    backups, which is fine for a demo; upgrade the plan for anything you want to keep.

databases:
  - name: sieg-db
    plan: free
    region: oregon
    databaseName: ai_applicant
    user: sieg

services:
  - type: web
    name: sieg-backend
    runtime: node
    region: oregon # keep the same region as the database (internal connection string)
    plan: starter
    branch: integration/frontend-backend
    rootDir: backend
    # prisma + @nestjs/cli are devDependencies, so install them too. The Prisma client is generated (not committed).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Safe on every start: applies only pending, committed migrations; never resets or drops data.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: sieg-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # random, stored by Render, never in git
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false # paste in the dashboard; never commit
      - key: UPLOAD_DIR
        value: /var/data/uploads # on the persistent disk above
      - key: CORS_ORIGINS
        value: https://noobsabhaeducaro.vercel.app # add other frontend origins comma-separated; PORT is provided by Render
