# Render Blueprint: the NestJS + Prisma backend on Render's FREE web tier. Zero hosting cost.
#
#  - The PostgreSQL database is NOT created here: use an external Neon database (free) and paste its
#    connection string as DATABASE_URL in the Render dashboard.
#  - No persistent disk (disks are paid). Uploaded files live in temporary storage and are lost on
#    restart / idle spin-down / redeploy. Everything extracted from a processed document (text, claims,
#    runs, evaluations) is in PostgreSQL and survives. See DEPLOY_RENDER.md.
#  - No secret values are stored in this file: DATABASE_URL and GEMINI_API_KEY are entered in the
#    dashboard (sync: false); JWT_SECRET is generated by Render. The frontend never receives a key.

services:
  - type: web
    name: sieg-backend
    runtime: node
    plan: free
    region: oregon # pick a region close to your Neon database
    branch: integration/frontend-backend
    rootDir: backend
    # prisma + @nestjs/cli are devDependencies, so install them too. The Prisma client is generated (not committed).
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Safe on every start: applies only pending, committed migrations; never resets or drops data.
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # Neon connection string, pasted in the dashboard
      - key: GEMINI_API_KEY
        sync: false # pasted in the dashboard; never commit, never put in Vercel
      - key: JWT_SECRET
        generateValue: true # random, stored by Render, never in git
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: UPLOAD_DIR
        value: /tmp/uploads # TEMPORARY storage on the free tier (see DEPLOY_RENDER.md)
      - key: CORS_ORIGINS
        value: https://noobsabhaeducaro.vercel.app # add other frontend origins comma-separated; PORT is provided by Render
